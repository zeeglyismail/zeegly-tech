# Cloudflare terminates TLS and proxies through the tunnel, so the real
# visitor IP arrives in CF-Connecting-IP, not remote_addr.
# NOTE: log_format is only valid in the http context. Files in conf.d are
# included inside http, so it must sit here — outside the server block.
log_format  tunnel  '$http_cf_connecting_ip - "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    access_log  /var/log/nginx/access.log  tunnel;

    include /etc/nginx/snippets/security-headers.conf;

    # ── Compression ───────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    # ── Caching ───────────────────────────────────────────────────
    # Every location below sets its own add_header, so each must re-include
    # the security headers (see the note in security-headers.conf).

    # Astro fingerprints these filenames, so they can cache forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML must revalidate or visitors get a stale site after a deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;
}
