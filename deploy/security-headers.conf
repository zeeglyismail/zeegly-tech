# Shared security headers.
#
# WHY A SEPARATE FILE: in nginx, an `add_header` inside a location block
# discards every add_header inherited from the parent. So any location that
# sets its own header must re-include these, or the site silently loses them.
add_header X-Content-Type-Options  "nosniff"                          always;
add_header X-Frame-Options         "SAMEORIGIN"                       always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

# Google Fonts is the only external origin the page touches.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
